<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Federico Ostan Bazan</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Bootstrap-like CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">Federico Ostan</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#about">About</a>
                    </li>
                    <li class="nav-item">

                    <li class="nav-item">
                        <a class="nav-link" href="#contact">Contact</a>
                    </li>
                </ul>
            </div>
        </div>

    <main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">

            <div class="row justify-content-center">
                <div class="col-md-8">
                    <h1 class="display-4 mb-4">Federico Ostan Bazan</h1>

                    <div class="first-time-section">
                        <p class="lead mb-4">First time here?</p>
                        <div class="d-flex justify-content-center gap-3">
                            <button class="btn btn-outline-primary btn-lg" onclick="handleFirstTimeResponse(true)">Yes</button>
                            <button class="btn btn-outline-primary btn-lg" onclick="handleFirstTimeResponse(false)">No</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</html>
